name: One-time QAI lockfile synchronization

on:
  push:
    branches:
      - qai/answer-integrity-postgres

permissions:
  contents: write

jobs:
  refresh-lockfile:
    # The special commit that adds this workflow is its only intended trigger.
    if: >-
      github.event.head_commit.message == 'chore(ci): retry one-time lockfile refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qai/answer-integrity-postgres
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Synchronize npm lockfile only
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile to QAI staging
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(qai): synchronize npm lockfile for reproducible installs"
          git push origin HEAD:qai/answer-integrity-postgres
